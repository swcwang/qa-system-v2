# config.yaml - Q&A System Configuration

# Vector store settings
embedding_model_name: "BAAI/bge-large-en-v1.5"
chroma_path: "./data/chroma_db_hf_may"
collection_name: "qa_chunks"
n_chunks_to_retrieve_k: 80

# AI model settings  
chat_model_name: "gpt-4o-mini"
temperature: 0.3

# Enhancement settings
min_host_length: 50
min_panelist_length: 20
max_results: 15

# Data paths
duck_db_name: "./data/qanda_may.duckdb"
input_json_path: "./data/input_json2"

# Debug mode
debug_enabled: false
